<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parking Pin — Toolkit Mocks</title>
<link rel="stylesheet" href="mock.css">
<style>
.screen { --app-bg:#101014; --app-ink:#F2F2F7; --app-accent:#4FA8E8; --chip-bg:rgba(255,255,255,0.10); --hairline:rgba(255,255,255,0.14); --on-accent:#fff; }

.app-body { padding: 0 18px; }
.app-header { padding: 10px 2px 4px; }
.mchips { display:flex; flex-wrap:wrap; gap:7px; justify-content:center; margin:14px 0 10px; }
.mchip { font-size:12px; font-weight:700; padding:7px 13px; border-radius:999px; background:var(--chip-bg); color:var(--app-ink); }
.mchip.on { background:var(--app-accent); color:var(--on-accent); }
.ro-mid { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; text-align:center; }
.ro-value { font-size:56px; font-weight:800; font-variant-numeric:tabular-nums; letter-spacing:-0.02em; }
.ro-value small { font-size:19px; font-weight:600; opacity:0.55; }
.ro-note { font-size:13px; opacity:0.6; text-align:center; }
.ro-subs { display:flex; gap:14px; font-size:12.5px; opacity:0.75; font-variant-numeric:tabular-nums; flex-wrap:wrap; justify-content:center; }
.meter-track { width:82%; height:8px; border-radius:4px; background:var(--chip-bg); overflow:hidden; }
.meter-fill { height:100%; border-radius:4px; background:var(--app-accent); }
.dial-wrap { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; }
.dial-ring { position:relative; width:210px; height:210px; border-radius:50%; border:2px solid var(--hairline); display:flex; align-items:center; justify-content:center; }
.tick { position:absolute; left:50%; top:50%; width:2px; height:10px; background:var(--hairline); }
.dial-needle { position:absolute; left:50%; top:9px; width:3px; height:38px; border-radius:2px; background:var(--app-accent); transform:translateX(-50%); }
.dial-center { text-align:center; }
.dial-value { font-size:38px; font-weight:800; font-variant-numeric:tabular-nums; }
.beat-dots { position:absolute; bottom:26px; display:flex; gap:8px; }
.bd { width:10px; height:10px; border-radius:50%; background:var(--chip-bg); }
.bd.on { background:var(--app-accent); }
.lvl-bubble { position:absolute; width:44px; height:44px; border-radius:50%; background:radial-gradient(circle at 35% 30%, #fff8, var(--app-accent)); top:44%; left:52%; }
.cv-wrap { flex:1; display:flex; flex-direction:column; justify-content:center; gap:10px; }
.cv-row { display:flex; justify-content:space-between; align-items:center; background:var(--chip-bg); border-radius:16px; padding:20px 18px; }
.cv-row.focus { outline:2px solid var(--app-accent); }
.cv-val { font-size:26px; font-weight:800; font-variant-numeric:tabular-nums; }
.cv-unit { font-size:13px; font-weight:700; opacity:0.6; letter-spacing:0.06em; }
.cv-swap { text-align:center; font-size:20px; color:var(--app-accent); }
.cam-view { flex:1; position:relative; border-radius:20px; margin-top:8px; overflow:hidden;
  background: linear-gradient(145deg,#232a31 0%,#151a1f 55%,#0c0f12 100%); }
.cam-view::after { content:""; position:absolute; inset:0;
  background: radial-gradient(circle at 30% 25%, rgba(255,255,255,0.07), transparent 45%); }
.cam-note { position:absolute; left:12px; right:12px; bottom:12px; z-index:2; text-align:center; font-size:12.5px;
  background:rgba(0,0,0,0.55); border-radius:10px; padding:8px 10px; color:#fff; }
.qr-c { position:absolute; width:30px; height:30px; border:3px solid #fff; z-index:2; }
.qr-c.tl { top:16%; left:18%; border-right:none; border-bottom:none; border-top-left-radius:8px; }
.qr-c.tr { top:16%; right:18%; border-left:none; border-bottom:none; border-top-right-radius:8px; }
.qr-c.bl { bottom:26%; left:18%; border-right:none; border-top:none; border-bottom-left-radius:8px; }
.qr-c.br { bottom:26%; right:18%; border-left:none; border-top:none; border-bottom-right-radius:8px; }
.cam-cross { position:absolute; top:42%; left:50%; width:40px; height:40px; border:3px solid #fff; border-radius:50%; transform:translate(-50%,-50%); z-index:2; }
.cam-cross::after { content:""; position:absolute; inset:16px; background:#fff; border-radius:50%; }
.cam-ring { position:absolute; inset:10px; border:14px solid rgba(255,255,255,0.85); border-radius:16px; z-index:2; }
.cam-doc { position:absolute; inset:18% 14% 30%; border:2px solid var(--app-accent); border-radius:6px; background:rgba(255,255,255,0.08); z-index:2; }
.cam-lines { position:absolute; inset:24% 16% 38%; z-index:2; display:flex; flex-direction:column; gap:10px; }
.cam-lines i { height:12px; border-radius:3px; background:color-mix(in srgb, var(--app-accent) 55%, transparent); }
.cam-measure { position:absolute; top:48%; left:14%; right:14%; height:2px; background:var(--app-accent); z-index:2; }
.cam-measure span { position:absolute; left:-5px; top:-5px; width:12px; height:12px; border-radius:50%; background:var(--app-accent); box-shadow: 210px 0 0 var(--app-accent); }
.cam-angle { position:absolute; bottom:28%; left:20%; width:120px; height:80px; border-left:3px solid var(--app-accent); border-bottom:3px solid var(--app-accent); z-index:2; }
.cam-gates i { position:absolute; top:20%; bottom:32%; width:3px; background:var(--app-accent); z-index:2; }
.cam-gates i:first-child { left:26%; } .cam-gates i:last-child { right:26%; }
.cam-split { position:absolute; top:0; bottom:0; left:50%; width:2px; background:#fff; z-index:2; }
.shutter-row { display:flex; justify-content:center; padding:4px 0 8px; }
.shutter { width:54px; height:54px; border-radius:50%; background:#fff; box-shadow:0 0 0 4px rgba(255,255,255,0.35); }
.li-wrap { flex:1; display:flex; flex-direction:column; gap:9px; justify-content:center; }
.li-row { display:flex; justify-content:space-between; align-items:center; background:var(--chip-bg); border-radius:14px; padding:13px 15px; }
.li-row strong { display:block; font-size:14.5px; }
.li-row span { display:block; font-size:12px; opacity:0.6; margin-top:2px; }
.li-chev { font-size:18px; opacity:0.4; }
.calc-wrap { flex:1; display:flex; flex-direction:column; justify-content:center; gap:9px; }
.calc-row { display:flex; justify-content:space-between; background:var(--chip-bg); border-radius:13px; padding:13px 15px; font-size:14px; }
.calc-row span { opacity:0.65; }
.calc-result { margin-top:10px; text-align:center; background:color-mix(in srgb, var(--app-accent) 16%, transparent); border:1px solid color-mix(in srgb, var(--app-accent) 45%, transparent); border-radius:16px; padding:18px; }
.calc-big { font-size:29px; font-weight:800; font-variant-numeric:tabular-nums; color:var(--app-accent); }
.calc-sub { font-size:12.5px; opacity:0.65; margin-top:4px; }
.disp-wrap { flex:1; border-radius:20px; margin-top:8px; display:flex; align-items:center; justify-content:center; padding:20px; text-align:center; }
.disp-big { font-size:30px; font-weight:800; line-height:1.3; overflow-wrap:anywhere; }
.g-wrap { flex:1; display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; align-content:center; }
.g-cell { background:var(--chip-bg); border-radius:12px; padding:14px 6px; text-align:center; font-size:12.5px; font-weight:700; }
.spin-obj { font-size:74px; }

</style></head><body>
<div class="mock-stage">
  <nav class="mock-nav">
    <a href="index.html">‹ All mocks</a>
    <span>
      <a href="grid-reference.html">← Prev</a>
      <a href="launch-timer.html" style="margin-left:14px">Next →</a>
    </span>
  </nav>
  <div class="mock-meta">
    <p class="mock-kicker">Outdoors &amp; travel</p>
    <h1>🅿️ Parking Pin</h1>
    <div class="mock-badges"><span class="badge">concept mock</span></div>
  </div>
  <div class="phone"><div class="screen">
    <div class="notch"></div><div class="statusbar"><span>9:41</span><span>📶 ⌁ 🔋</span></div>
    <div class="app-body">
      <div class="app-header"><span class="app-title">Parking Pin</span><span class="icon-btn">⚙︎</span></div>
      <div class="ro-mid">
      <div class="ro-value">0:47<small> left on meter</small></div>
      <div class="ro-note">Level 2, spot B14</div>
      
      <div class="ro-subs"><span>pinned 2:14 pm</span><span>180 m away</span></div>
    </div><div class="mchips"><span class="mchip on">Walk back</span><span class="mchip">Extend</span><span class="mchip">New pin</span></div>
    </div>
    <div class="tabbar"><span class="tab active"><span class="glyph">●</span>Tool</span><span class="tab"><span class="glyph">◔</span>History</span><span class="tab"><span class="glyph">⚙</span>Settings</span></div>
    <div class="home-indicator"></div>
  </div></div>
</div>
</body></html>
